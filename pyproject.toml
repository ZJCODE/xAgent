[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myxagent"
version = "1.0.0"
description = "Independent AI Agent with Persistent First-Person Memory and Multi-User Interaction"
readme = { file = "README.md", content-type = "text/markdown" }
license-files = ["LICENSE*"]
authors = [{ name = "ZJun", email = "zhangjun310@live.com" }]
keywords = ["ai", "agent", "openai", "chatbot", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    # Core frameworks
    "fastapi>=0.116.1",
    "pydantic>=2.11.7",
    "uvicorn>=0.35.0",
    
    # AI/ML and agents
    "openai>=1.98.0",
    "anthropic>=0.116.0",
    
    # HTTP clients
    "httpx>=0.28.0",
    "websockets>=14.0",
    # Utilities
    "pyyaml>=6.0.2",
    "readchar>=4.2.1",
    "rich>=13.9.4",
    "tenacity>=9.1.2",
]

[project.optional-dependencies]
feishu = ["lark-oapi>=1.5.5"]
weixin = ["cryptography>=42.0.0", "qrcode[pil]>=7.4.2"]
voice = ["sounddevice>=0.5.0", "python-socks>=2.4.0"]
image = ["pillow>=10.0.0"]
search = []
observability = ["langfuse>=3.0.0", "posthog>=3.6.0"]
all = [
    "lark-oapi>=1.5.5",
    "qrcode[pil]>=7.4.2",
    "cryptography>=42.0.0",
    "sounddevice>=0.5.0",
    "python-socks>=2.4.0",
    "pillow>=10.0.0",
    "langfuse>=3.0.0",
    "posthog>=3.6.0",
]

[project.scripts]
xagent = "xagent.interfaces.cli:main"

[project.urls]
Repository = "https://github.com/ZJCODE/xagent"
Issues = "https://github.com/ZJCODE/xagent/issues"
Homepage = "https://github.com/ZJCODE/xagent#readme"

[tool.setuptools]
packages = {find = {include = ["xagent*"], exclude = ["examples*", "tests*", "docs*"]}}

[tool.setuptools.package-data]
xagent = ["interfaces/static/**", "components/skills/builtin/**"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
